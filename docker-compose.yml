services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vyronex_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/vyronex
      - JWT_SECRET=vyronex_production_secure_jwt_secret_key_2026
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: vyronex_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
    driver: local
